name: Flagship Screenshots

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Record Roborazzi screenshots
        run: ./gradlew :app:recordRoborazziUniversalFossDebug --stacktrace

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flagship-screenshots
          path: app/build/outputs/roborazzi/
