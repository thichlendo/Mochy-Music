name: Build Mochy APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Permission
        run: chmod +x ./gradlew

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.wrapper.network.timeout=120000 -Dorg.gradle.internal.network.retry.max.attempts=5"
        run: ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.wrapper.network.timeout=120000

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MochyMusic-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
